<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGNAL DESK</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="topbar">
    <div>
      <h1>SIGNAL DESK</h1>
      <p>기술적 지표 + 뉴스 감성 · 자동 스캔 · 실전계좌 연동</p>
    </div>

    <div class="live-indicator">
      <span></span>
      LIVE
    </div>
  </header>

  <main class="container">

    <!-- 종목 검색 -->
    <section class="search-section">
      <input
        id="searchInput"
        type="text"
        placeholder="종목명 또는 종목코드"
        autocomplete="off"
      />

      <button id="searchBtn">
        검색
      </button>
    </section>

    <!-- 실전 계좌 -->
    <section class="live-account">
      <div class="section-header">
        <div>
          <span class="live-badge">● LIVE</span>
          <h2>실전 계좌</h2>
        </div>

        <button id="accountRefreshBtn">
          계좌 새로고침
        </button>
      </div>

      <div id="accountStatus" class="account-status">
        계좌 정보를 불러오는 중…
      </div>

      <div id="accountSummary" class="account-summary"></div>

      <div id="accountHoldings" class="account-holdings"></div>
    </section>

    <!-- 실전 주문 -->
    <section class="live-order">
      <div class="section-header">
        <div>
          <span class="live-badge">LIVE ORDER</span>
          <h2>실전 주문</h2>
        </div>
      </div>

      <div class="order-warning">
        ⚠️ 이 주문은 한국투자증권 <strong>실전 계좌</strong>로 전송됩니다.
      </div>

      <div class="order-grid">

        <select id="orderSide">
          <option value="buy">매수</option>
          <option value="sell">매도</option>
        </select>

        <input
          id="orderCode"
          type="text"
          placeholder="종목코드"
          autocomplete="off"
        />

        <input
          id="orderQuantity"
          type="number"
          min="1"
          step="1"
          placeholder="수량"
        />

        <select id="orderType">
          <option value="market">시장가</option>
          <option value="limit">지정가</option>
        </select>

        <input
          id="orderPrice"
          type="number"
          min="0"
          step="0.01"
          placeholder="가격"
          disabled
        />

      </div>

      <label class="order-confirm">
        <input
          id="orderConfirm"
          type="checkbox"
        />
        실제 실전계좌에 주문을 전송하는 것을 확인했습니다.
      </label>

      <button
        id="orderSubmitBtn"
        class="live-order-button"
      >
        실전 주문 전송
      </button>

      <div
        id="orderResult"
        class="order-result"
      ></div>
    </section>

    <!-- 기존 분석 영역 -->
    <section id="analysisSection">

      <div id="signalBoard"></div>

      <div id="chartContainer"></div>

      <div id="newsContainer"></div>

      <div id="backtestContainer"></div>

    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
